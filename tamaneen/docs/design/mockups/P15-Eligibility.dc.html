.btn{font:inherit;font-weight:600;font-size:16px;min-height:52px;border-radius:999px;border:0;padding:0 24px;cursor:pointer}
.btn-primary{background:#1F5F5B;color:#FFFFFF}

.opt{font:inherit;font-size:15px;font-weight:600;min-height:52px;border-radius:12px;border:1px solid #B9C9C6;background:#FFFFFF;color:#1B2A2F;cursor:pointer;text-align:right;padding:0 16px}
.field{font:inherit;font-size:16px;height:52px;box-sizing:border-box;width:100%;border:1px solid #B9C9C6;border-radius:12px;padding:0 14px;background:#FFFFFF;color:#1B2A2F}

<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF8F1; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 20px">
    <a href="#" aria-label="رجوع" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B2A2F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>

  </header>
  <main style="flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 0 20px 20px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-size: 24px; font-weight: 700">سؤالان قبل البدء</h1>
      <p class="muted" style="margin: 0; font-size: 15px; line-height: 1.7">التجربة الحالية للبالغين داخل [منطقة التجربة] فقط.</p>
    </div>
    <fieldset style="border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-weight: 600; font-size: 15px; margin-bottom: 8px">هل عمرك 18 سنة أو أكثر؟</legend>
      <button class="opt" type="button" style="border: 2px solid #1F5F5B; background: #E3EFED">نعم</button>
      <button class="opt" type="button">لا</button>
    </fieldset>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="city" style="font-weight: 600; font-size: 15px">أين تقيم حاليًا؟</label>
      <select id="city" class="field"><option>[المدينة ضمن منطقة التجربة]</option></select>
    </div>
    <div style="background: #FFFFFF; border: 1px solid #DDE3E1; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px">
      <div style="font-weight: 600; font-size: 14px">إذا لم تنطبق عليك الشروط</div>
      <div class="muted" style="font-size: 14px; line-height: 1.7">سنعرض لك خدمات دعم نفسي أخرى متاحة لك، ولن ننشئ حسابًا.</div>
    </div>
    <div style="flex: 1"></div>
    <button class="btn btn-primary" type="button">متابعة</button>
  </main>
