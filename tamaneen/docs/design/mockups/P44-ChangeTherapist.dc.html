<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:#1B2A2F}
a{color:#1F5F5B}a:hover{color:#163F3C}
.btn{font:inherit;font-weight:600;font-size:16px;min-height:54px;border-radius:999px;border:0;padding:0 24px;cursor:pointer}
.btn-primary{background:#1F5F5B;color:#FFFFFF}
.help{font:inherit;font-weight:600;font-size:14px;min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid #B3261E;color:#B3261E;background:#FFFFFF;cursor:pointer}
.muted{color:#4A5A5E}
.opt{display:flex;gap:12px;align-items:center;padding:12px 14px;background:#FFFFFF;border-radius:18px;font-size:14px;min-height:48px;box-sizing:border-box;box-shadow:0 1px 0 #F1E6DA}
.opt input{width:20px;height:20px;accent-color:#1F5F5B;flex-shrink:0}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF8F1; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 20px">
    <a href="#" aria-label="رجوع" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B2A2F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
    <button class="help" type="button">مساعدة فورية</button>
  </header>
  <main style="flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 0 20px 20px">
    <h1 style="margin: 0; font-size: 23px; font-weight: 700">تغيير الأخصائي</h1>
    <p class="muted" style="margin: 0 0 4px; font-size: 14px; line-height: 1.7">من الطبيعي ألا يناسبك أول أخصائي. لن نخبر أ. سارة بالسبب، ويبقى ملفك معك.</p>
    <div style="font-weight: 600; font-size: 15px">ما السبب؟ (اختياري)</div>
    <label class="opt"><input type="radio" name="r">لم أشعر بالارتياح</label>
    <label class="opt"><input type="radio" name="r" checked>المواعيد لا تناسبني</label>
    <label class="opt"><input type="radio" name="r">أفضّل أخصائيًا من جنس آخر</label>
    <label class="opt"><input type="radio" name="r">أحتاج تخصصًا مختلفًا</label>
    <label class="opt"><input type="radio" name="r">سبب آخر</label>
    <div style="background: #E4F1EE; border-radius: 16px; padding: 12px 14px; font-size: 13px; line-height: 1.7; color: #163F3C">سيقترح عليك المشرف أخصائيين جددًا خلال 24 ساعة. موعدك الحالي يبقى قائمًا حتى تختار.</div>
    <div style="flex: 1"></div>
    <button class="btn btn-primary" type="button">إرسال الطلب</button>
  </main>
</div>
