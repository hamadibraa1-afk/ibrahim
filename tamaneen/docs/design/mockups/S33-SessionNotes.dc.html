<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ملاحظات الجلسة</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:#1B2A2F}
a{color:#1F5F5B}a:hover{color:#163F3C}
.card{background:#FFFFFF;border:1px solid #DDE3E1;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.btn{font:inherit;font-weight:600;font-size:14px;min-height:44px;border-radius:10px;border:0;padding:0 16px;cursor:pointer;white-space:nowrap}
.btn-primary{background:#1F5F5B;color:#FFFFFF}
.btn-ghost{background:#FFFFFF;color:#1F5F5B;border:1px solid #B9C9C6}
.muted{color:#4A5A5E}
.lbl{font-size:13px;font-weight:700;display:flex;gap:8px;align-items:center}
.tag{font-size:11px;font-weight:700;width:22px;height:22px;border-radius:6px;background:#E3EFED;color:#163F3C;display:flex;align-items:center;justify-content:center}
.ta{font:inherit;font-size:14px;line-height:1.8;box-sizing:border-box;width:100%;border:1px solid #B9C9C6;border-radius:10px;padding:8px 12px;resize:vertical;background:#FFFFFF}
.k{font-size:12px;font-weight:600;color:#4A5A5E}
.q{font-size:13px;line-height:1.7;background:#FFF8F1;border-radius:10px;padding:8px 10px}
</style>
</helmet>
<div dir="rtl" style="min-height: 900px; background: #F6F7F5; display: flex; flex-wrap: wrap">
  <div style="flex: 1 1 220px; max-width: 260px"><dc-import name="StaffNav" role="therapist" active="schedule" hint-size="100%,900px"></dc-import></div>
  <div style="flex: 999 1 560px; min-width: 0; padding: 20px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px">
      <div><div class="muted" style="font-size: 13px">P-4TT8-90AA · الجلسة 5 · اليوم 1:00 – 1:50 م</div><h1 style="margin: 0; font-size: 24px; font-weight: 700">ملاحظات الجلسة</h1></div>
      <div style="display: flex; gap: 8px; align-items: center"><span class="muted" style="font-size: 12px">حُفظت المسودة قبل 20 ثانية</span><button class="btn btn-ghost" type="button">حفظ كمسودة</button><button class="btn btn-primary" type="button">توقيع وقفل الملاحظة</button></div>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
      <section class="card" style="flex: 3 1 520px; min-width: 0">
        <div style="display: flex; gap: 8px; flex-wrap: wrap"><span class="muted" style="font-size: 13px">القالب:</span><button class="btn btn-ghost" type="button" style="min-height: 32px; font-size: 13px; background: #E3EFED">SOAP</button><button class="btn btn-ghost" type="button" style="min-height: 32px; font-size: 13px">DAP</button><button class="btn btn-ghost" type="button" style="min-height: 32px; font-size: 13px">نص حر</button></div>
        <label class="lbl" for="s"><span class="tag">S</span>ما ذكره المريض</label>
        <textarea id="s" class="ta" style="height: 72px">ينام أسرع منذ بدء تمرين التنفس. ما زال قلقًا من اجتماع الأحد مع مديره.</textarea>
        <label class="lbl" for="o"><span class="tag">O</span>ملاحظاتي</label>
        <textarea id="o" class="ta" style="height: 56px">هادئ، تواصل جيد، مزاج أفضل من الجلسة السابقة. PHQ-9 = 8.</textarea>
        <label class="lbl" for="a"><span class="tag">A</span>التقييم</label>
        <textarea id="a" class="ta" style="height: 56px">تحسن في الأرق. قلق توقعي مرتبط بالعمل. لا مؤشرات خطر.</textarea>
        <label class="lbl" for="p"><span class="tag">P</span>الخطة</label>
        <textarea id="p" class="ta" style="height: 56px">بدء التنشيط السلوكي، ولعب أدوار لاجتماع الأحد في الجلسة القادمة.</textarea>
        <label style="display: flex; gap: 10px; align-items: center; font-size: 14px; min-height: 40px"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #1F5F5B">إرسال ملخص قصير للمريض (3 نقاط، بلغة بسيطة)</label>
      </section>
      <aside style="flex: 2 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
        <div class="card"><div class="k">ما أراد المريض الحديث عنه</div><div class="q">«النوم تحسن، لكن ما زلت قلقًا من اجتماع الأحد.»</div></div>
        <div class="card"><div class="k">آخر أسبوع</div><div style="font-size: 14px">الواجبات 8 / 9 · المزاج 6.4 · لا تنبيهات</div><a href="#" style="font-size: 13px; font-weight: 600">التقرير الكامل</a></div>
        <div class="card"><div class="k">إجراءات سريعة</div><div style="display: flex; flex-wrap: wrap; gap: 8px"><button class="btn btn-ghost" type="button">إسناد واجب</button><button class="btn btn-ghost" type="button">حجز الجلسة القادمة</button><button class="btn btn-ghost" type="button">طلب مقياس</button><button class="btn btn-ghost" type="button" style="color: #B3261E; border-color: #E8B4AE">تقييم خطر</button></div></div>
      </aside>
    </div>
  </div>
</div>
</x-dc>

</body>
</html>
