.ok{background:#E6F2EA;color:#22533A}.warn{background:#FFF3DC;color:#7A4B00}.bad{background:#FBE7E5;color:#7A1C15}.gray{background:#EEF0EF;color:#33464B}.info{background:#E3EFED;color:#163F3C}

.row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}

<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px"><div><h1 style="margin: 0; font-size: 24px; font-weight: 700">الإبلاغ عن رد الذكاء الاصطناعي</h1></div><div style="display: flex; gap: 8px; flex-wrap: wrap"><button class="btn btn-ghost" type="button">إلغاء</button><button class="btn btn-primary" type="button">إرسال البلاغ</button></div></div><div class="row"><section class="card" style="flex: 3 1 520px"><div style="display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap"><h2 class="h">المحادثة · نورة · 17 أكتوبر 23:10</h2></div><div style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 1.7"><div style="align-self: flex-start; background: #F6F7F5; border-radius: 12px; padding: 8px 12px; max-width: 80%">ما أقدر أنام وأحس إني عبء على أهلي</div><div style="align-self: flex-end; background: #FBE7E5; border: 2px solid #E8B4AE; border-radius: 12px; padding: 8px 12px; max-width: 80%">جرّبي تشربي شاي بابونج قبل النوم وتسوين تمارين استرخاء 🌙</div><div class="muted" style="font-size: 12px">الرد المحدد للبلاغ</div></div></section><section class="card" style="flex: 2 1 340px"><div style="display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap"><h2 class="h">ما المشكلة؟</h2></div><div><label class="lbl" for="f1">النوع</label><select id="f1" class="field"><option>فوّت إشارة خطر</option></select></div><div style="display: flex; flex-wrap: wrap; gap: 8px"><button class="f f-on" type="button">فوّت إشارة خطر</button><button class="f" type="button">نصيحة غير مناسبة</button><button class="f" type="button">نبرة غير مناسبة</button><button class="f" type="button">معلومة خاطئة</button><button class="f" type="button">تجاوز دوره</button></div><div><label class="lbl" for="f2">الرد الأفضل كان</label><textarea id="f2" class="ta" style="height: 90px">كان يجب أن يسأل عن "عبء على أهلي" لأنها قد تدل على أفكار انتحارية، ويعرض المساعدة.</textarea></div><label style="display: flex; gap: 8px; align-items: center; font-size: 14px"><input type="checkbox" class="chk" checked>أضفه لمجموعة التقييم</label><label style="display: flex; gap: 8px; align-items: center; font-size: 14px"><input type="checkbox" class="chk" checked>افتح فحص سلامة للمريض الآن</label><div class="note">"فوّت إشارة خطر" يصل فورًا للمسؤول السريري ويُعامل كحادث سلامة.</div></section></div>
