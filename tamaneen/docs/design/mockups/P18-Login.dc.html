<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>تسجيل الدخول</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:#1B2A2F}
a{color:#1F5F5B}a:hover{color:#163F3C}
.btn{font:inherit;font-weight:600;font-size:16px;min-height:52px;border-radius:999px;border:0;padding:0 24px;cursor:pointer}
.btn-primary{background:#1F5F5B;color:#FFFFFF}
.btn-ghost{background:#FFFFFF;color:#1F5F5B;border:1px solid #B9C9C6}
.help{font:inherit;font-weight:600;font-size:14px;min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid #B3261E;color:#B3261E;background:#FFFFFF;cursor:pointer}
.muted{color:#4A5A5E}
.lbl{font-size:14px;font-weight:600}
.field{font:inherit;font-size:16px;height:52px;box-sizing:border-box;width:100%;border:1px solid #B9C9C6;border-radius:12px;padding:0 14px;background:#FFFFFF;color:#1B2A2F}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF8F1; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 20px">
    <div style="font-weight: 700; font-size: 20px; color: #1F5F5B">طمأنينة</div>
    <button class="help" type="button">مساعدة فورية</button>
  </header>
  <main style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 24px 20px 20px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 700">أهلًا بعودتك</h1>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label class="lbl" for="u">رقم الجوال أو البريد</label>
      <input class="field" id="u" value="05X XXX XXXX" dir="ltr" style="text-align: right">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label class="lbl" for="p">كلمة المرور</label>
      <input class="field" id="p" type="password" value="xxxxxxxxxx">
      <a href="#" style="font-size: 14px; font-weight: 600; align-self: flex-start; min-height: 44px; display: flex; align-items: center">نسيت كلمة المرور؟</a>
    </div>
    <div role="alert" style="background: #FBEAE8; border-radius: 12px; padding: 10px 14px; font-size: 14px; color: #7A1C15">البيانات غير صحيحة. تبقّت محاولتان قبل الإيقاف المؤقت 15 دقيقة.</div>
    <button class="btn btn-primary" type="button">تسجيل الدخول</button>
    <div style="display: flex; align-items: center; gap: 10px" class="muted"><div style="flex: 1; height: 1px; background: #DDE3E1"></div><span style="font-size: 13px">أو</span><div style="flex: 1; height: 1px; background: #DDE3E1"></div></div>
    <button class="btn btn-ghost" type="button">الدخول بمفتاح المرور</button>
    <div style="flex: 1"></div>
    <div style="text-align: center; font-size: 15px">ليس لديك حساب؟ <a href="#" style="font-weight: 600">ابدأ الآن</a></div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
