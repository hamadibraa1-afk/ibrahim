body{margin:0;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:#1B2A2F}
a{color:#1F5F5B}a:hover{color:#163F3C}
.card{background:#FFFFFF;border:1px solid #DDE3E1;border-radius:16px}
.btn{font:inherit;font-weight:600;font-size:16px;min-height:52px;border-radius:999px;border:0;padding:0 24px;cursor:pointer}
.btn-primary{background:#1F5F5B;color:#FFFFFF}
.btn-ghost{background:#FFFFFF;color:#1F5F5B;border:1px solid #B9C9C6}
.help{font:inherit;font-weight:600;font-size:14px;min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid #B3261E;color:#B3261E;background:#FFFFFF;cursor:pointer}
.muted{color:#4A5A5E}
.code{font-family:ui-monospace,Menlo,monospace;font-size:15px;font-weight:600;letter-spacing:1px;padding:8px 0;text-align:center;background:#FFF8F1;border-radius:8px}
</style>

<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF8F1; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 20px">
    <div style="font-weight: 700; font-size: 20px; color: #1F5F5B">طمأنينة</div>
    <button class="help" type="button">مساعدة فورية</button>
  </header>
  <main style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 0 20px 20px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-size: 24px; font-weight: 700">احفظ رموز الاسترجاع</h1>
      <p class="muted" style="margin: 0; font-size: 15px; line-height: 1.7">إذا فقدت جوالك، تستطيع الدخول بأحد هذه الرموز. كل رمز يُستخدم مرة واحدة، ولن نعرضها مرة أخرى.</p>
    </div>
    <div class="card" dir="ltr" style="padding: 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div class="code">7KQ2-M9XA</div><div class="code">P4TZ-81LD</div>
      <div class="code">C6WN-3RHE</div><div class="code">Q8VB-52JS</div>
      <div class="code">H1MD-7TPK</div><div class="code">Z3YA-64NC</div>
      <div class="code">L9EF-20UW</div><div class="code">R5GX-38QB</div>
      <div class="code">B2KJ-95VM</div><div class="code">T7NP-16DX</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button class="btn btn-ghost" type="button">تنزيل كملف</button>
      <button class="btn btn-ghost" type="button">نسخ</button>
    </div>
    <div class="card" style="padding: 14px; display: flex; gap: 12px; align-items: center">
      <div style="flex: 1"><div style="font-weight: 600; font-size: 15px">حماية إضافية (اختياري)</div><div class="muted" style="font-size: 13px">تطبيق مصادقة أو مفتاح مرور</div></div>
      <button class="btn btn-ghost" type="button" style="min-height: 44px; font-size: 14px; padding: 0 14px">إعداد</button>
    </div>
    <div style="flex: 1"></div>
    <label style="display: flex; gap: 10px; align-items: center; font-size: 14px; min-height: 44px"><input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #1F5F5B">حفظت الرموز في مكان آمن</label>
    <button class="btn btn-primary" type="button">متابعة</button>
  </main>
</div>
